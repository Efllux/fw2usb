name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: libraw1394 C ABI smoke
        run: |
          cargo build -p fw2usb-raw1394
          cc -std=c11 -Wall -Wextra -Werror -I host/libraw1394-shim/include host/libraw1394-shim/tests/abi.c -L target/debug -lfw2usb_raw1394 -o target/raw1394-abi
          LD_LIBRARY_PATH=target/debug target/raw1394-abi
      - name: no_std cross-build (firmware target)
        run: cargo build -p fw-clock -p fw-amdtp -p fw-phy-model -p fw-1394 --lib --target thumbv7em-none-eabihf

  gateware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-09'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r gateware/requirements.lock
      - uses: dtolnay/rust-toolchain@stable
      - run: PYTHONPATH=gateware python -m unittest discover -s gateware/tests -v
      - run: python gateware/build.py --core lreq
      - run: python gateware/build.py --core status
      - run: python gateware/build.py --core receive
      - run: python gateware/build.py --core transmit
      - run: python gateware/build.py --core phy_link
      - run: python gateware/build.py --core crc32
      - run: python gateware/build.py --core cycle
      - run: python gateware/build.py --core selfid
      - run: python gateware/build.py --core packet_rx
      - run: python gateware/build.py --core packet_tx
      - run: python gateware/build.py --core ack
      - run: python gateware/build.py --core cycle_master
      - run: python gateware/build.py --core link_layer
      - run: python gateware/build.py --core csr
      - run: python gateware/build.py --core rom_reader
      - run: python gateware/build.py --core transaction
      - run: python gateware/build.py --core transaction_link
      - run: python gateware/build.py --core amdtp_rx
      - run: python gateware/build.py --core amdtp_tx
      - run: python gateware/build.py --core syt
      - run: python gateware/build.py --core iso_rx
      - run: python gateware/build.py --core iso_tx
      - run: python gateware/build.py --core usb_raw
      - run: python gateware/build.py --core raw_iso
      - run: python gateware/build.py --core frame_encoder
      - run: python gateware/build.py --core frame_decoder
      - run: PYTHONPATH=gateware python gateware/sim/cosim.py --cycles 8
      - run: PYTHONPATH=gateware python gateware/sim/native_cosim.py --cycles 8 --family bebob
      - run: PYTHONPATH=gateware python gateware/sim/native_cosim.py --cycles 8 --family dice
      - run: PYTHONPATH=gateware python gateware/sim/native_cosim.py --cycles 8 --fault crc
      - run: python gateware/build.py --core async_request
      - run: python gateware/build.py --core raw_worker
      - run: python gateware/build.py --core usb_audio
      - run: python gateware/build.py --core usb_bridge
      - run: python gateware/build.py --route
      - uses: actions/upload-artifact@v4
        with:
          name: gateware-smoke
          path: gateware/build/

  coreaudio:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C host/coreaudio check
